[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
entry = "uv run ruff check ."
language = "system"
pass_filenames = false
always_run = true

[[repos]]
repo = "https://github.com/nbQA-dev/nbQA"
rev = "1.9.1"

[[repos.hooks]]
id = "nbqa-ruff-check"
additional_dependencies = ["ruff==0.15.16"]
files = "\\.ipynb$"

[[repos]]
repo = "https://github.com/kynan/nbstripout"
rev = "0.9.1"

[[repos.hooks]]
id = "nbstripout"
name = "check notebook outputs are cleared"
args = ["--verify", "--keep-id"]
