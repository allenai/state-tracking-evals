[project]
name = "emergence-analysis"
version = "0.1.0"
description = "Analysis and launch helpers for OLMo eval experiments"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "anthropic>=1.8.0",
    "google-genai>=2.25.0",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "jupyterlab>=4.5.8",
    "matplotlib>=3.10.8",
    "notebook>=7.5.7",
    "olmo-eval[beaker]",
    "openai>=3.19.2",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.2",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "tqdm>=4.67.1",
]

# Two upstream repos are vendored as git submodules pinned to specific commits;
# gantry stamps each Beaker job with the git repo it was launched from, so those
# pins are the versions the jobs clone and run. Run `git submodule update --init`
# after cloning, and note a pinned commit must be pushed to GitHub to launch.
#
#   olmo-eval  (tracks allenai/olmo-eval jacksonp/ladder) -- also installed
#     editable below, so this one pin controls both the local `olmo-eval` CLI and
#     the eval jobs, which scripts/run_statebench_*.py launch with cwd set to the
#     submodule.
#   olmo-core  (tracks allenai/OLMo-core jacksonp/state-bench-dt) -- NOT a
#     dependency of this project: it caps Python at <3.12 and needs its own torch,
#     so scripts/train_dt.sh runs it as its own uv project (Python 3.11) rather
#     than from this environment.
#   state-bench  (tracks jopetty/state-bench main) -- NOT a dependency of this
#     project: vendored so the data-generation side of the experiments lives
#     alongside the training and eval submodules.
[tool.uv.sources]
olmo-eval = { path = "olmo-eval", editable = true }

[dependency-groups]
dev = [
    "prek>=0.4.5",
    "ruff>=0.15.16",
    "ty>=0.0.48",
]

[tool.ruff]
# The vendored submodules carry their own lint configs; linting them here would
# make this repo's hooks fail on upstream code after a submodule bump.
extend-exclude = [
    "olmo-core",
    "olmo-eval",
    "sensitivity-estimate",
    "state-bench",
    "state-bench-paper",
]
