[project]
name = "emergence-analysis"
version = "0.1.0"
description = "Analysis and launch helpers for OLMo eval experiments"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "jupyterlab>=4.5.8",
    "matplotlib>=3.10.8",
    "notebook>=7.5.7",
    "olmo-eval[beaker]",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.2",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "tqdm>=4.67.1",
]

# olmo-eval is vendored as a git submodule pinned to a specific commit (tracking
# the jacksonp/ladder branch). This single pin controls both the local CLI
# (installed editable from the submodule) and the version Beaker jobs run: the
# launch scripts invoke `olmo-eval beaker launch` with cwd set to the submodule,
# and gantry clones the CWD repo at HEAD into the job. Run `git submodule
# update --init` after cloning; the pinned commit must be pushed to GitHub for
# launches to work.
[tool.uv.sources]
olmo-eval = { path = "olmo-eval", editable = true }

[dependency-groups]
dev = [
    "prek>=0.4.5",
    "ruff>=0.15.16",
    "ty>=0.0.48",
]
